[package]
name = "PiStreamTerminal"
version = "0.1.0"
edition = "2021"

[dependencies]
rug = "1.22"
indicatif = "0.17"
rayon = "1.8"

[dev-dependencies]
criterion = "0.5"

[[bench]]
name = "pi_benchmarks"
harness = false

[lib]
name = "pi_stream_terminal"
path = "src/lib.rs"

[[bin]]
name = "PiStreamTerminal"
path = "src/main.rs"
