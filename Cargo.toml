[package]
name = "PiStreamTerminal"
version = "0.1.0"
edition = "2021"

[dependencies]
rug = "1.22"
indicatif = "0.17"
rayon = "1.8"
async-trait = "0.1"
tokio = { version = "1.0", features = ["full"] }
chrono = { version = "0.4", features = ["serde"] }
ctrlc = "3.4"

[dev-dependencies]
criterion = "0.5"

[[bench]]
name = "pi_benchmarks"
harness = false

[lib]
name = "pi_stream_terminal"
path = "src/lib.rs"

[[bin]]
name = "PiStreamTerminal"
path = "src/main.rs"
